appId: com.getinboxzero.desktop
productName: InboxJarvis
copyright: Copyright © Inbox Zero
artifactName: InboxJarvis-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
npmRebuild: false
protocols:
  - name: InboxJarvis
    schemes:
      - inboxzero
linux:
  target:
    - target: dir
      arch:
        - x64
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  forceCodeSigning: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
publish:
  provider: generic
  url: https://github.com/sv182124/InboxJarvis/releases/download/desktop-updates
